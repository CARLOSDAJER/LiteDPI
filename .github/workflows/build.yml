name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/AssemblyInfo.cs -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tag must match version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} doesn't match Version ${{ steps.version.outputs.version }} in src/AssemblyInfo.cs"
          }

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          $name = "LiteDPI-v${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item LiteDPI.exe, litedpi-probe.exe, install.ps1, uninstall.ps1, README.md, CHANGELOG.md dist/$name
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteDPI-v${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Release notes = this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "LiteDPI $v" }
          Set-Content notes.md $notes
          gh release create "v$v" "dist/LiteDPI-v$v.zip" --title "LiteDPI v$v" --notes-file notes.md
