name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest   # SignPath Foundation requires GitHub-hosted runners
    env:
      # Sign only tagged releases, and only once SignPath is set up (see docs/SIGNING.md).
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/AssemblyInfo.cs -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tag must match version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} doesn't match Version ${{ steps.version.outputs.version }} in src/AssemblyInfo.cs"
          }

      - name: Build
        shell: cmd
        run: build.cmd

      # ---- Code signing (SignPath) ----
      - name: Stage exes for signing
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/unsigned | Out-Null
          Copy-Item LiteDPI.exe, litedpi-probe.exe dist/unsigned

      - name: Upload unsigned exes
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/unsigned/

      - name: Sign with SignPath (approve the request in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'LiteDPI' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # time you have to approve
          output-artifact-directory: dist/signed

      - name: Check signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/signed/*.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status) - $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      # ---- Package ----
      - name: Package
        shell: pwsh
        run: |
          $name = "LiteDPI-v${{ steps.version.outputs.version }}"
          $bin = if ($env:SIGN -eq 'true') { 'dist/signed' } else { '.' }
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item "$bin/LiteDPI.exe", "$bin/litedpi-probe.exe" dist/$name
          Copy-Item install.ps1, uninstall.ps1, README.md, CHANGELOG.md, LICENSE dist/$name
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteDPI-v${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Release notes = this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "LiteDPI $v" }
          if ($env:SIGN -eq 'true') {
            $notes += "`n`n---`n**Code signing policy:** Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). " +
                      "See the [code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)."
          }
          Set-Content notes.md $notes
          gh release create "v$v" "dist/LiteDPI-v$v.zip" --title "LiteDPI v$v" --notes-file notes.md
